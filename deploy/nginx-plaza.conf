# 角色卡广场 nginx 反代片段（dfzjb.site）
#
# 粘到 dfzjb.site 的 server { } 块内（与跑团中继的 location /ws 并列），然后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 要点：
# - client_max_body_size 必须放宽（nginx 默认 1m，会直接 413 掉卡上传）
# - X-Forwarded-For 必须用 $remote_addr 覆盖（不能用 $proxy_add_x_forwarded_for，
#   后者会保留客户端自带 XFF——服务端限速/审计取最右一段，$remote_addr 保证最右就是真实 IP）
# - X-Forwarded-Proto 传 $scheme，服务端据此拼卡片绝对地址
# - 广场与跑团中继同机不同端口：/plaza/ → 8788，/ws → 8787

# ── 角色卡广场：清单 / 卡片 / 上传与下架 API ──
location /plaza/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8m;   # 卡 PNG 常见 1~3MB，服务端上限 6MB，这里留余量
}

